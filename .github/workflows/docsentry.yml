name: Documentation governance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify documentation contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: CarlLee1983/Docsentry@v0.7.0
        with:
          config: .docsentry.json
          format: json
