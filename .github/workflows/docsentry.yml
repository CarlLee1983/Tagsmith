name: Documentation governance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify documentation contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: CarlLee1983/Docsentry@54d6e9023dcd63a69060c177f329e35759cbcfb9 # v0.9.0
        with:
          config: .docsentry.json
          format: github
