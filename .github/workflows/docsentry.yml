name: Documentation governance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify documentation contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: CarlLee1983/Docsentry@54d6e9023dcd63a69060c177f329e35759cbcfb9 # v0.9.0
        with:
          config: .docsentry.json
          format: github
