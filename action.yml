name: Tagsmith
description: Audit tag safety and expose a read-only multi-line release plan against a Tagsmith specification.
author: Carl Lee
branding:
  icon: tag
  color: blue

inputs:
  working-directory:
    description: Repository directory containing .tagsmith.json.
    required: false
    default: .
  fetch-tags:
    description: Fetch tags from origin before validating.
    required: false
    default: "true"
  plan-from-commits:
    description: Derive SemVer plan bumps from Conventional Commits.
    required: false
    default: "false"
  plan-require-changes:
    description: Require every planned line to declare a workspace.
    required: false
    default: "false"
  plan-tag:
    description: Tag line whose ready candidate is exposed as next-tag; defaults to the config default.
    required: false
    default: ""

outputs:
  plan:
    description: Versioned JSON envelope from tagsmith plan --all --json.
    value: ${{ steps.release-plan.outputs.plan }}
  has-releases:
    description: True when the plan contains at least one ready tag line.
    value: ${{ steps.release-plan.outputs.has-releases }}
  next-tag:
    description: Ready candidate for plan-tag or the config default line; empty when unavailable.
    value: ${{ steps.release-plan.outputs.next-tag }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install Tagsmith
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --ignore-scripts
    - name: Build Tagsmith
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm run build
    - name: Fetch repository tags
      if: inputs.fetch-tags == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: git fetch --tags origin
    - name: Audit tags
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: node "$GITHUB_ACTION_PATH/dist/cli/index.js" audit --json
    - name: Plan releases
      id: release-plan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_PLAN_FROM_COMMITS: ${{ inputs.plan-from-commits }}
        INPUT_PLAN_REQUIRE_CHANGES: ${{ inputs.plan-require-changes }}
        INPUT_PLAN_TAG: ${{ inputs.plan-tag }}
      run: |
        plan_args=(plan --all --json)
        if [[ "$INPUT_PLAN_FROM_COMMITS" == "true" ]]; then plan_args+=(--from-commits); fi
        if [[ "$INPUT_PLAN_REQUIRE_CHANGES" == "true" ]]; then plan_args+=(--require-changes); fi
        plan_file="$RUNNER_TEMP/tagsmith-plan.json"
        set +e
        node "$GITHUB_ACTION_PATH/dist/cli/index.js" "${plan_args[@]}" > "$plan_file"
        plan_status=$?
        set -e
        node - "$plan_file" "$GITHUB_OUTPUT" "$INPUT_PLAN_TAG" <<'NODE'
        const fs = require("node:fs");
        const [planFile, outputFile, requestedLine] = process.argv.slice(2);
        const plan = JSON.parse(fs.readFileSync(planFile, "utf8"));
        const selectedLine = requestedLine || plan.data.defaultLine;
        const line = plan.data.lines.find((item) => item.line === selectedLine);
        const nextTag = line?.status === "ready" ? line.candidate.tag : "";
        fs.appendFileSync(
          outputFile,
          `plan<<TAGSMITH_PLAN\n${JSON.stringify(plan)}\nTAGSMITH_PLAN\n` +
            `has-releases=${String(plan.data.hasReleases)}\n` +
            `next-tag=${nextTag}\n`,
        );
        NODE
        exit "$plan_status"
