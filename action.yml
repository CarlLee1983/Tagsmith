name: Tagsmith
description: Audit tag safety and expose a read-only multi-line release plan against a Tagsmith specification.
author: Carl Lee
branding:
  icon: tag
  color: blue

inputs:
  working-directory:
    description: Repository directory containing .tagsmith.json.
    required: false
    default: .
  fetch-tags:
    description: Fetch tags from the selected remote before validating; complete shallow history for commit planning.
    required: false
    default: "true"
  remote:
    description: Remote used for tag and history fetch.
    required: false
    default: origin
  plan-from-commits:
    description: Derive SemVer plan bumps from Conventional Commits.
    required: false
    default: "false"
  plan-require-changes:
    description: Require every planned line to declare a workspace.
    required: false
    default: "false"
  plan-tag:
    description: Tag line whose ready candidate is exposed as next-tag; defaults to the config default.
    required: false
    default: ""

outputs:
  plan:
    description: Versioned JSON envelope from tagsmith plan --all --json.
    value: ${{ steps.release-plan.outputs.plan }}
  has-releases:
    description: True when the plan contains at least one ready tag line.
    value: ${{ steps.release-plan.outputs.has-releases }}
  next-tag:
    description: Ready candidate for plan-tag or the config default line; empty when unavailable.
    value: ${{ steps.release-plan.outputs.next-tag }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
    - name: Install Tagsmith
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --ignore-scripts
    - name: Build Tagsmith
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm run build
    - name: Audit tags and plan releases
      id: release-plan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_FETCH_TAGS: ${{ inputs.fetch-tags }}
        INPUT_PLAN_FROM_COMMITS: ${{ inputs.plan-from-commits }}
        INPUT_PLAN_REQUIRE_CHANGES: ${{ inputs.plan-require-changes }}
        INPUT_PLAN_TAG: ${{ inputs.plan-tag }}
        INPUT_REMOTE: ${{ inputs.remote }}
      run: node "$GITHUB_ACTION_PATH/scripts/action.mjs"
